<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>외부 브라우저 연결</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f4f6f8;
      color: #333;
    }
    .card {
      background: #ffffff;
      padding: 30px 20px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 440px;
      text-align: center;
    }
    h2 { font-size: 20px; margin-top: 0; margin-bottom: 12px; }
    p { font-size: 14px; color: #666; line-height: 1.5; margin: 8px 0; }
    
    .btn-action {
      display: block;
      margin: 20px 0 10px 0;
      padding: 14px;
      background-color: #0095f6;
      color: #ffffff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      border: none;
      width: 100%;
    }
    .guide-box {
      margin-top: 20px;
      padding: 14px;
      background-color: #fff9db;
      border: 1px solid #ffe066;
      border-radius: 8px;
      text-align: left;
      font-size: 13px;
      color: #856404;
    }
    .guide-box ol { margin: 6px 0 0 0; padding-left: 20px; }
    .guide-box li { margin-bottom: 4px; }
    
    /* 생성기 스타일 */
    input[type="url"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ced4da;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .result-box {
      margin-top: 15px;
      padding: 12px;
      background: #e7f5ff;
      border-radius: 8px;
      display: none;
    }
    .result-box textarea {
      width: 100%;
      height: 55px;
      font-size: 12px;
      border: 1px solid #a5d8ff;
      border-radius: 6px;
      resize: none;
    }
  </style>
</head>
<body>

  <!-- 1. 링크 생성 화면 (URL 파라미터가 없을 때) -->
  <div class="card" id="generator-view" style="display: none;">
    <h2>🔗 인스타 탈출 링크 생성기</h2>
    <input type="url" id="targetInput" placeholder="https://player.sauceflex.com/..." />
    <button class="btn-action" onclick="generateLink()">변환 링크 만들기</button>

    <div class="result-box" id="resultBox">
      <textarea id="generatedUrl" readonly></textarea>
      <button class="btn-action" onclick="copyLink()" style="background:#1971c2; margin-top:8px;">링크 복사</button>
    </div>
  </div>

  <!-- 2. 인앱 브라우저 탈출 랜딩 화면 (URL 파라미터가 있을 때) -->
  <div class="card" id="redirect-view" style="display: none;">
    <h2 id="viewTitle">외부 브라우저로 이동</h2>
    <p>원활한 시청을 위해 외부 브라우저(크롬/사파리)로 연결합니다.</p>
    
    <button class="btn-action" id="openBtn" onclick="tryEscape()">외부 브라우저로 열기</button>

    <!-- iOS 유저를 위한 메뉴 가이드 (아이폰 인앱 차단 대응) -->
    <div class="guide-box" id="iosGuide" style="display: none;">
      <strong>⚠️ 화면이 넘어가지 않나요?</strong>
      <ol>
        <li>우측 상단 <b>··· (더보기)</b> 또는 <b>공유</b> 버튼 터치</li>
        <li><b>[Safari로 열기]</b> 또는 <b>[시스템 브라우저로 열기]</b> 선택</li>
      </ol>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetUrl = urlParams.get('url');
    const ua = navigator.userAgent.toLowerCase();
    const isAndroid = /android/.test(ua);
    const isIOS = /iphone|ipad|ipod/.test(ua);
    const isInstagram = /instagram/.test(ua);

    if (targetUrl) {
      document.getElementById('redirect-view').style.display = 'block';

      if (isIOS) {
        document.getElementById('iosGuide').style.display = 'block';
      }

      // 사용자가 페이지를 켰을 때 1차 탈출 시도
      tryEscape();
    } else {
      document.getElementById('generator-view').style.display = 'block';
    }

    function tryEscape() {
      if (!targetUrl) return;
      const cleanUrl = targetUrl.replace(/https?:\/\//, "");

      if (isAndroid) {
        // 안드로이드: 인텐트 스킴 호출
        location.href = `intent://${cleanUrl}#Intent;scheme=https;package=com.android.chrome;end`;
      } else if (isIOS && isInstagram) {
        // iOS 인스타그램: ftp 프로토콜 또는 webcal/safari 스킴 시도
        location.href = targetUrl;
        // 사파리 호출용 hidden iframe fallback
        const iframe = document.createElement("iframe");
        iframe.style.display = "none";
        iframe.src = `x-safari-${targetUrl}`;
        document.body.appendChild(iframe);
      } else {
        location.href = targetUrl;
      }
    }

    function generateLink() {
      const input = document.getElementById('targetInput').value.trim();
      if (!input || !input.startsWith('http')) {
        alert('올바른 URL을 입력해주세요.');
        return;
      }
      const baseUrl = window.location.origin + window.location.pathname;
      document.getElementById('generatedUrl').value = `${baseUrl}?url=${encodeURIComponent(input)}`;
      document.getElementById('resultBox').style.display = 'block';
    }

    function copyLink() {
      const copyText = document.getElementById('generatedUrl');
      copyText.select();
      navigator.clipboard.writeText(copyText.value);
      alert('복사되었습니다.');
    }
  </script>
</body>
</html>
